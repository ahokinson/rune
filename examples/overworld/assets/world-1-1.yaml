  ......................................PP......PP.....PP.................................................................................XX..XX........XX..XX...........................XXXXXX.......................
  ............................PP........PP......PP.....PP................................................................................XXX..XXX......XXX..XXX......PP.............PP..XXXXXXX.......................
  ...S..................g.....PP........PPg.....PP..gg.PP..........................................k......g.............................XXXX..XXXX....XXXX..XXXX.....PP...gg........PP.XXXXXXXX.........F.............
